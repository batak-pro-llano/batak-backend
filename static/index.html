<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BATAK SYSTEM</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            color: #58a6ff;
            font-size: 24px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #30363d;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #8b949e;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: #58a6ff;
            border-bottom: 2px solid #58a6ff;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #f0f6fc;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #58a6ff;
        }

        button.btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        button.btn-submit:hover {
            background-color: #2ea043;
        }

        button.btn-secondary {
            background-color: #21262d;
            border: 1px solid #30363d;
        }

        button.btn-secondary:hover {
            background-color: #30363d;
        }

        .hidden {
            display: none;
        }

        #qr-card, #historial-card {
            margin-top: 20px;
            padding: 20px;
            background-color: #0d1117;
            border-radius: 8px;
            border: 1px solid #30363d;
        }

        #qr-image {
            width: 180px;
            height: 180px;
            margin: 15px 0;
            border-radius: 8px;
            background-color: #ffffff;
            padding: 8px;
        }

        .user-info {
            color: #58a6ff;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .qr-code-text {
            font-family: monospace;
            background: #21262d;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            color: #79c0ff;
        }

        .historial-list {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
        }

        .historial-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #21262d;
            font-size: 14px;
        }

        .historial-item:last-child {
            border-bottom: none;
        }

        .puntaje-val {
            color: #3fb950;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>BATAK SYSTEM</h1>
        <p class="subtitle">Acceso a jugadores y seguimiento de puntajes</p>

        <!-- Pestañas de Navegación -->
        <div class="tabs" id="tab-container">
            <button class="tab-btn active" onclick="mostrarFormulario('login')">INICIAR SESIÓN</button>
            <button class="tab-btn" onclick="mostrarFormulario('registro')">REGISTRARSE</button>
        </div>

        <!-- Formulario de Login -->
        <form id="form-login" onsubmit="realizarLogin(event)">
            <div class="form-group">
                <label for="login-email">Correo Electrónico</label>
                <input type="email" id="login-email" required placeholder="tuemail@ejemplo.com">
            </div>
            <div class="form-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Ingresar</button>
        </form>

        <!-- Formulario de Registro -->
        <form id="form-registro" class="hidden" onsubmit="realizarRegistro(event)">
            <div class="form-group">
                <label for="reg-nombre">Nombre de Jugador</label>
                <input type="text" id="reg-nombre" required placeholder="Ej: Piloto_01">
            </div>
            <div class="form-group">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" required placeholder="tuemail@ejemplo.com">
            </div>
            <div class="form-group">
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Crear Cuenta</button>
        </form>

        <!-- Tarjeta del Código QR -->
        <div id="qr-card" class="hidden">
            <p class="user-info" id="user-display-name">Jugador</p>
            <p style="font-size: 12px; color: #8b949e;">Muestra este código al lector Batak</p>
            
            <img id="qr-image" src="" alt="Código QR del Jugador">
            
            <div>
                <span class="qr-code-text" id="qr-code-display">BATAK-XXXXXX</span>
            </div>

            <button class="btn-submit" style="background-color: #1f6beb; margin-top: 15px;" onclick="cargarHistorial()">Ver Historial</button>
            <button class="btn-submit btn-secondary" style="margin-top: 8px;" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>

        <!-- Tarjeta de Historial -->
        <div id="historial-card" class="hidden">
            <h3 style="color: #58a6ff; font-size: 16px; margin-bottom: 10px;">Historial de Partidas</h3>
            
            <div id="lista-historial" class="historial-list">
                <p style="text-align: center; color: #8b949e;">Cargando...</p>
            </div>

            <button class="btn-submit btn-secondary" style="margin-top: 15px;" onclick="volverAQR()">Volver al QR</button>
        </div>
    </div>

    <script>
        let usuarioActualId = null;

        function mostrarFormulario(tipo) {
            const formLogin = document.getElementById('form-login');
            const formRegistro = document.getElementById('form-registro');
            const btns = document.querySelectorAll('.tab-btn');

            if (tipo === 'login') {
                formLogin.classList.remove('hidden');
                formRegistro.classList.add('hidden');
                btns[0].classList.add('active');
                btns[1].classList.remove('active');
            } else {
                formLogin.classList.add('hidden');
                formRegistro.classList.remove('hidden');
                btns[0].classList.remove('active');
                btns[1].classList.add('active');
            }
        }

        async function realizarRegistro(e) {
            e.preventDefault();
            const nombre = document.getElementById('reg-nombre').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            try {
                const res = await fetch('/api/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    usuarioActualId = data.id;
                    mostrarQR(data.nombre, data.qr_code);
                } else {
                    alert("Error: " + (data.detail || data.mensaje));
                }
            } catch (err) {
                alert("Error de conexión al servidor");
            }
        }

        async function realizarLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    usuarioActualId = data.id;
                    mostrarQR(data.nombre, data.qr_code);
                } else {
                    alert("Error: " + (data.detail || data.mensaje));
                }
            } catch (err) {
                alert("Error de conexión al servidor");
            }
        }

        function mostrarQR(nombre, qrCode) {
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('form-registro').classList.add('hidden');
            document.getElementById('tab-container').classList.add('hidden');
            document.getElementById('historial-card').classList.add('hidden');

            document.getElementById('user-display-name').textContent = "¡Bienvenido, " + nombre + "!";
            document.getElementById('qr-code-display').textContent = qrCode;

            const urlImagen = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrCode)}`;
            document.getElementById('qr-image').src = urlImagen;

            document.getElementById('qr-card').classList.remove('hidden');
        }

        async function cargarHistorial() {
            if (!usuarioActualId) return;

            document.getElementById('qr-card').classList.add('hidden');
            document.getElementById('historial-card').classList.remove('hidden');

            const lista = document.getElementById('lista-historial');
            lista.innerHTML = '<p style="text-align: center; color: #8b949e;">Cargando partidas...</p>';

            try {
                const res = await fetch(`/api/historial/${usuarioActualId}`);
                const data = await res.json();

                if (res.ok && data.partidas && data.partidas.length > 0) {
                    lista.innerHTML = '';
                    data.partidas.forEach((p, index) => {
                        const fechaFormateada = p.fecha ? new Date(p.fecha).toLocaleDateString() : `#${index + 1}`;
                        lista.innerHTML += `
                            <div class="historial-item">
                                <span>Partida ${fechaFormateada}</span>
                                <span class="puntaje-val">${p.puntaje} pts</span>
                            </div>
                        `;
                    });
                } else {
                    lista.innerHTML = '<p style="text-align: center; color: #8b949e;">Aún no tienes partidas registradas.</p>';
                }
            } catch (err) {
                lista.innerHTML = '<p style="text-align: center; color: #f85149;">Error al cargar el historial.</p>';
            }
        }

        function volverAQR() {
            document.getElementById('historial-card').classList.add('hidden');
            document.getElementById('qr-card').classList.remove('hidden');
        }

        function cerrarSesion() {
            usuarioActualId = null;
            document.getElementById('qr-card').classList.add('hidden');
            document.getElementById('historial-card').classList.add('hidden');
            document.getElementById('tab-container').classList.remove('hidden');
            mostrarFormulario('login');
        }
    </script>
</body>
</html>
