<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batak Game - Portal Jugador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <h1 class="text-3xl font-bold text-center text-cyan-400 mb-2">BATAK SYSTEM</h1>
        <p class="text-slate-400 text-center text-sm mb-6">Acceso a jugadores y seguimiento de puntajes</p>

        <!-- SECTOR DE PESTAÑAS (REGISTRO / LOGIN) -->
        <div id="tabsHeader" class="flex border-b border-slate-700 mb-6">
            <button id="tabRegisterBtn" onclick="showTab('register')" 
                class="w-1/2 py-2 text-center text-sm font-bold border-b-2 border-cyan-400 text-cyan-400 focus:outline-none">
                Registrarse
            </button>
            <button id="tabLoginBtn" onclick="showTab('login')" 
                class="w-1/2 py-2 text-center text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-white focus:outline-none">
                Iniciar Sesión
            </button>
        </div>

        <!-- FORMULARIO DE REGISTRO -->
        <form id="registroForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nombre Completo</label>
                <input type="text" id="regNombre" required placeholder="Tu nombre" 
                    class="w-full px-4 py-2 bg-slate-700 rounded-lg text-white border border-slate-600 focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Correo Electrónico</label>
                <input type="email" id="regEmail" required placeholder="correo@ejemplo.com" 
                    class="w-full px-4 py-2 bg-slate-700 rounded-lg text-white border border-slate-600 focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Contraseña</label>
                <input type="password" id="regPassword" required placeholder="••••••••" 
                    class="w-full px-4 py-2 bg-slate-700 rounded-lg text-white border border-slate-600 focus:outline-none focus:border-cyan-400">
            </div>
            <button type="submit" 
                class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold rounded-lg transition duration-200">
                Obtener Código QR
            </button>
        </form>

        <!-- FORMULARIO DE INICIO DE SESIÓN -->
        <form id="loginForm" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Correo Electrónico</label>
                <input type="email" id="loginEmail" required placeholder="correo@ejemplo.com" 
                    class="w-full px-4 py-2 bg-slate-700 rounded-lg text-white border border-slate-600 focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Contraseña</label>
                <input type="password" id="loginPassword" required placeholder="••••••••" 
                    class="w-full px-4 py-2 bg-slate-700 rounded-lg text-white border border-slate-600 focus:outline-none focus:border-cyan-400">
            </div>
            <button type="submit" 
                class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold rounded-lg transition duration-200">
                Ingresar a Mi Cuenta
            </button>
        </form>

        <!-- SECCIÓN PERFIL Y CÓDIGO QR -->
        <div id="profileSection" class="hidden text-center space-y-4">
            <h2 id="userNameText" class="text-xl font-bold text-cyan-400"></h2>
            <p class="text-slate-300 text-sm">Escanea este código QR en la consola Batak:</p>
            
            <div class="flex justify-center p-4 bg-white rounded-xl w-fit mx-auto shadow-inner">
                <div id="qrcode"></div>
            </div>

            <p id="qrText" class="text-xs text-slate-400 font-mono"></p>

            <div class="pt-2 flex flex-col gap-2">
                <button id="btnHistorial" 
                    class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-cyan-400 font-semibold rounded-lg border border-cyan-500/30 transition">
                    📜 Ver Mi Historial de Partidas
                </button>
                <button onclick="cerrarSesion()" 
                    class="w-full py-2 bg-red-500/20 hover:bg-red-500/30 text-red-400 font-semibold rounded-lg border border-red-500/30 transition text-xs">
                    Cerrar Sesión
                </button>
            </div>
        </div>

        <!-- SECCIÓN HISTORIAL DE PARTIDAS -->
        <div id="historialSection" class="hidden space-y-4">
            <h2 class="text-xl font-bold text-center text-cyan-400">Mis Partidas Guardadas</h2>
            <div id="contenedorTabla" class="max-h-60 overflow-y-auto border border-slate-700 rounded-lg">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-700 text-slate-300 uppercase sticky top-0">
                        <tr>
                            <th class="p-2">Nivel</th>
                            <th class="p-2">Puntos</th>
                            <th class="p-2">Tiempo</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo" class="divide-y divide-slate-700 text-slate-200">
                    </tbody>
                </table>
            </div>
            <p id="sinPartidas" class="text-xs text-slate-400 text-center hidden">Aún no has jugado ninguna partida.</p>
            <button id="btnVolverPerfil" 
                class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 font-semibold rounded-lg text-sm transition">
                ⬅ Volver a Mi Código QR
            </button>
        </div>
    </div>

    <script>
        let currentUserId = localStorage.getItem('batak_user_id');
        let currentUserName = localStorage.getItem('batak_user_name');
        let currentQR = localStorage.getItem('batak_user_qr');

        // Control de Pestañas
        function showTab(tab) {
            const regForm = document.getElementById('registroForm');
            const loginForm = document.getElementById('loginForm');
            const tabRegBtn = document.getElementById('tabRegisterBtn');
            const tabLoginBtn = document.getElementById('tabLoginBtn');

            if (tab === 'register') {
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                tabRegBtn.className = "w-1/2 py-2 text-center text-sm font-bold border-b-2 border-cyan-400 text-cyan-400 focus:outline-none";
                tabLoginBtn.className = "w-1/2 py-2 text-center text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-white focus:outline-none";
            } else {
                regForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
                tabLoginBtn.className = "w-1/2 py-2 text-center text-sm font-bold border-b-2 border-cyan-400 text-cyan-400 focus:outline-none";
                tabRegBtn.className = "w-1/2 py-2 text-center text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-white focus:outline-none";
            }
        }

        // Cargar perfil guardado automáticamente si existe sesión previa
        window.addEventListener('DOMContentLoaded', () => {
            if (currentUserId && currentQR) {
                mostrarPerfil(currentUserName, currentQR);
            }
        });

        function mostrarPerfil(nombre, qrCode) {
            document.getElementById('tabsHeader').classList.add('hidden');
            document.getElementById('registroForm').classList.add('hidden');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('profileSection').classList.remove('hidden');

            document.getElementById('userNameText').innerText = "¡Hola, " + nombre + "!";
            document.getElementById('qrText').innerText = "ID QR: " + qrCode;

            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = "";
            new QRCode(qrcodeDiv, {
                text: qrCode,
                width: 180,
                height: 180
            });
        }

        // REGISTRO
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = {
                nombre: document.getElementById('regNombre').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value
            };

            try {
                const res = await fetch('/api/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(usuario)
                });
                const data = await res.json();

                if (res.ok && data.exito) {
                    guardarSesion(data.usuario_id, usuario.nombre, data.codigo_qr);
                    mostrarPerfil(usuario.nombre, data.codigo_qr);
                } else {
                    alert(data.detail || "Error al registrar");
                }
            } catch (err) {
                alert("Error de conexión");
            }
        });

        // LOGIN
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const credenciales = {
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPassword').value
            };

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(credenciales)
                });
                const data = await res.json();

                if (res.ok && data.exito) {
                    guardarSesion(data.usuario.ID, data.usuario.NOMBRE, data.usuario.CÓDIGO_QR);
                    mostrarPerfil(data.usuario.NOMBRE, data.usuario.CÓDIGO_QR);
                } else {
                    alert(data.detail || "Error al iniciar sesión");
                }
            } catch (err) {
                alert("Error de conexión");
            }
        });

        // HISTORIAL DE PARTIDAS
        document.getElementById('btnHistorial').addEventListener('click', async () => {
            if (!currentUserId) return;

            try {
                const res = await fetch(`/api/historial/${currentUserId}`);
                const data = await res.json();

                if (res.ok && data.exito) {
                    const tbody = document.getElementById('tablaCuerpo');
                    const sinPartidas = document.getElementById('sinPartidas');
                    tbody.innerHTML = "";

                    if (data.historial.length === 0) {
                        sinPartidas.classList.remove('hidden');
                    } else {
                        sinPartidas.classList.add('hidden');
                        data.historial.forEach(p => {
                            const fila = `
                                <tr class="hover:bg-slate-700/50">
                                    <td class="p-2 font-bold text-cyan-400">Nivel ${p.NIVEL}</td>
                                    <td class="p-2 font-semibold">${p.POINT} pts</td>
                                    <td class="p-2">${p.TIEMPO_SEG}s</td>
                                </tr>
                            `;
                            tbody.innerHTML += fila;
                        });
                    }

                    document.getElementById('profileSection').classList.add('hidden');
                    document.getElementById('historialSection').classList.remove('hidden');
                }
            } catch (err) {
                alert("Error cargando el historial");
            }
        });

        document.getElementById('btnVolverPerfil').addEventListener('click', () => {
            document.getElementById('historialSection').classList.add('hidden');
            document.getElementById('profileSection').classList.remove('hidden');
        });

        function guardarSesion(id, nombre, qr) {
            currentUserId = id;
            currentUserName = nombre;
            currentQR = qr;
            localStorage.setItem('batak_user_id', id);
            localStorage.setItem('batak_user_name', nombre);
            localStorage.setItem('batak_user_qr', qr);
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.reload();
        }
    </script>
</body>
</html>
